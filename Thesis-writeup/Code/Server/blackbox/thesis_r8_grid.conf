# R8, black-box hyperparameter search of the thesis campaign (Thesis-writeup/Documentation/THESIS-RESULTS.md
# section 4, R8 paragraph). Stated 2026-10-08, BEFORE launch. One line per SLURM array index:
#   <index> <name> <arguments that differ from the shared ones>
# Run with BB_GRID=thesis_r8_grid.conf and BB_VERSION=lowpass (run_bb_search.sh).
#
# FIXED (as the grey box; set in run_bb_search.sh, not searched):
#   data Coulomb-tanh-and-MSD-lowpass-noise (--version lowpass), the same 18 training records,
#   4 kHz, window nf 400 = 0.1 s (cfg default), encoder lag na = nb = 29 (default), seed 1,
#   target e, float64 records, f block-mean, batch 256, stride 25, Adam, no dr (user 2026-10-06).
#   Selection on the 6 validation records only (free-run sim-RMS, deepSI best checkpoint);
#   test records are never loaded (train_bb_clmap.py loads train and val only).
#
# SEARCHED: state count nx, network widths (f and h width w, encoder width 2w, Jan's 16 : 8 ratio),
#   learning rate. Starting point: BLACKBOX-METHOD.md section 8 (e1 to e8; e8 = nx 16, w 8, lr 3e-3).
# INITIAL RANGES (11 configurations):
#   nx in {8, 16, 32} x w in {8, 16, 32} at lr 3e-3        (indices 0 to 8)
#   lr in {1e-3, 1e-2} at nx 16, w 16                       (indices 9, 10)
#   The closed-loop map (r, f) -> e holds plant and controller states, so nx above the plant's
#   order is expected (THESIS-RESULTS.md step 6); nx 32 is the initial upper end.
# EXPANSION RULE (HEURISTIC): if the best configuration sits on an edge of a range (nx 32, w 32,
#   w 8, lr 1e-3 or 1e-2), add the next value beyond that edge (nx 64, w 64, w 4, lr 3e-4, lr 3e-2)
#   at the best values of the other axes, as new indices from 11 upward, with the reason written
#   on the line. Never edit or reuse an index that has run.
#
# PER-CONFIGURATION LIMIT (search): 20000 Adam updates, validation every 1000 (20 free runs over
#   the 6 validation records); deepSI keeps the best validated model. About 2.5 to 5 h per
#   configuration on molokai (4 CPU threads), BLACKBOX-METHOD.md 5.3 and run_bb_search.sh header.
# TOTAL COMPUTE BUDGET (HEURISTIC): at most 30 search configurations (11 initial + up to 19 from
#   expansions) x 20000 updates, i.e. at most about 150 h wall = 600 CPU-h (4 threads) on molokai,
#   plus the final run below. Reported with the result: configurations tried, CPU-h with the CPU
#   model from each log's lscpu line, failures (NaN, timeouts), validation curves.
#
# SELECTION (HEURISTIC): lowest best-validation sim-RMS; within 2 % of the lowest, the configuration
#   with fewer parameters.
# VALIDATION PLATEAU CRITERION (HEURISTIC): a run has plateaued when its best validation sim-RMS
#   over the last 5 validations (5000 updates) is less than 1 % below its best before them.
#   A search configuration that has not plateaued at 20000 updates is marked "not converged" in the
#   search table; selection still uses its best value.
# FINAL (R8): retrain the selected index with BB_NITS=80000 (maximum training limit, about 10 to 20 h
#   on molokai; submit with -t 48:00:00), same seed and settings, best validation checkpoint kept.
#   If the curve has not plateaued at 80000 updates, this is reported as unresolved convergence;
#   test results never decide the stopping point.
#
# FINAL FORM (2026-10-16, D-264, supersedes SELECTION, LIMIT and FINAL above for the final campaign):
#   all 11 indices below run to 80000 updates with the grey box's objective: encoder window
#   na = nb = 30 past samples, loss weighted sigma_y/sigma_e per record and axis, selection on the
#   mean validation NRMS_e (`BB_NITS=80000 BB_SHARED_EXTRA="--na 30 --objective nrmse"`, CPU on
#   molokai/lanai). SELECTION: lowest best-validation NRMS_e, within 2 % the fewer parameters. The
#   selected index's run IS R8 (no separate retrain). A configuration whose training loss turned
#   non-finite is reported as failed (`result.json` status/failure); the 2026-10-11 search had three
#   (indices 6, 8, 10). The plateau criterion above applies to NRMS_e at the 80000 limit.
#
0  nx08_w08        --nx 8  --fh-width 8  --e-width 16 --lr 3e-3
1  nx08_w16        --nx 8  --fh-width 16 --e-width 32 --lr 3e-3
2  nx08_w32        --nx 8  --fh-width 32 --e-width 64 --lr 3e-3
3  nx16_w08        --nx 16 --fh-width 8  --e-width 16 --lr 3e-3
4  nx16_w16        --nx 16 --fh-width 16 --e-width 32 --lr 3e-3
5  nx16_w32        --nx 16 --fh-width 32 --e-width 64 --lr 3e-3
6  nx32_w08        --nx 32 --fh-width 8  --e-width 16 --lr 3e-3
7  nx32_w16        --nx 32 --fh-width 16 --e-width 32 --lr 3e-3
8  nx32_w32        --nx 32 --fh-width 32 --e-width 64 --lr 3e-3
9  nx16_w16_lr1e-3 --nx 16 --fh-width 16 --e-width 32 --lr 1e-3
10 nx16_w16_lr1e-2 --nx 16 --fh-width 16 --e-width 32 --lr 1e-2
